<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkoolBoks - Hemmelig Hangman-ord</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        padding: 24px;
        text-align: center;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        user-select: none;
      }
      h2 { margin-top: 0; margin-bottom: 8px; color: #38bdf8; font-size: 22px; font-weight: 800; }
      p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
      .input-group { margin-bottom: 16px; text-align: left; }
      label { display: block; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 14px;
        font-size: 22px;
        font-weight: bold;
        border-radius: 12px;
        border: 2px solid #334155;
        background: #1e293b;
        color: white;
        text-align: center;
      }
      input:focus { border-color: #38bdf8; outline: none; }
      .btn {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 12px;
        border: none;
        background: #0284c7;
        color: white;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover { background: #0369a1; }
      .toggle {
        background: transparent;
        border: none;
        color: #38bdf8;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        padding: 4px;
        margin-bottom: 12px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>🤫 Hemmelig Hangman-ord</h2>
    <p>Dra dette vinduet fritt over til lærerskjermen din slik at elever ikke ser ordet på prosjektoren!</p>
    <button type="button" class="toggle" onclick="toggleMask()">Vis / Skjul bokstaver</button>
    <form onsubmit="submitWord(event)">
      <div class="input-group">
        <input id="wordInput" type="password" placeholder="Skriv hemmelig ord her..." autofocus required />
      </div>
      <button type="submit" class="btn">🔒 Skjul ordet og start spillet</button>
    </form>

    <script>
      function toggleMask() {
        const inp = document.getElementById('wordInput');
        inp.type = inp.type === 'password' ? 'text' : 'password';
      }

      async function submitWord(e) {
        e.preventDefault();
        const val = document.getElementById('wordInput').value.trim();
        if (!val) return;

        // Try Tauri emit event first
        if (window.__TAURI_INTERNALS__) {
          try {
            const tauriEvent = window.__TAURI_INTERNALS__.plugins?.event;
            if (tauriEvent && tauriEvent.emit) {
              await tauriEvent.emit('hangman-secret-word', { word: val });
            }
          } catch (err) {}
        }

        // PostMessage fallback
        if (window.opener) {
          window.opener.postMessage({ type: 'HANGMAN_SECRET_WORD', word: val }, '*');
        }

        // Broadcast Channel fallback
        try {
          const bc = new BroadcastChannel('skoolboks-hangman');
          bc.postMessage({ type: 'HANGMAN_SECRET_WORD', word: val });
          bc.close();
        } catch (err) {}

        // Close current window
        try {
          if (window.__TAURI_INTERNALS__) {
            const { getCurrentWindow } = await import('/node_modules/@tauri-apps/api/window.js').catch(() => ({}));
            if (getCurrentWindow) {
              await getCurrentWindow().close();
              return;
            }
          }
        } catch (err) {}
        window.close();
      }
    </script>
  </body>
</html>
